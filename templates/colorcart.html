<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>ColorCart · 平涂换色</title><style>
:root{font:15px system-ui;color:#27333b;background:#f3f2ed}body{max-width:1280px;margin:0 auto;padding:28px}h1{font-size:30px;margin:0}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}a{color:#38695b}button,input,select,textarea{font:inherit;padding:8px;border:1px solid #bec8c1;border-radius:5px}button{background:#fff;cursor:pointer}.download{font:inherit;padding:8px;border:1px solid #bec8c1;border-radius:5px;text-decoration:none;color:#27333b;background:#fff}.download:hover{background:#e0ece4}button:hover{background:#e0ece4}button.primary{background:#376d5b;color:white}section{background:white;padding:18px;border-radius:9px;margin-bottom:16px}main{display:grid;grid-template-columns:300px 1fr;gap:18px}label{display:block;margin:10px 0}#canvas{width:100%;max-width:650px;image-rendering:pixelated;border:1px solid #ddd;background:repeating-conic-gradient(#eee 0 25%,white 0 50%) 0/16px 16px}#error{color:#b53527;white-space:pre-wrap}#status{color:#476b5a}#regions{max-height:280px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px}.region{font-size:13px;text-align:left}.selected{outline:3px solid #d7a649}.swatch{display:inline-block;width:16px;height:16px;border:1px solid #aaa;vertical-align:middle}small{color:#66716c}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}#stats{white-space:pre-wrap;font-size:13px}textarea{width:92%}aside section{padding:14px}#palette{display:flex;gap:6px;margin-top:8px}
</style><header><div><h1>ColorCart</h1><small>平涂插画的区域换色工作台 · 轻松试色，保留原稿</small></div><a href="/prepare">图像准备工作台 →</a></header><p id="error"></p><p id="status">选择一张平涂插画开始，也可试用合成演示。</p><main><aside><section><b>1 · 图像与项目</b><div class="actions"><button id="demo">加载合成演示</button></div><input type="file" id="upload" accept="image/*"><label>已有图像<select id="images"></select></label><label>项目名<input id="name" value="小镇配色练习"></label><label>分色数 <input type="number" id="colors" min="2" max="8" value="6"></label><label>忽略小区域面积 <input id="minarea" type="number" min="1" max="64" value="3"></label><button class="primary" id="create">建立区域图</button><label>继续编辑<select id="patterns"></select></label><button id="open">打开项目</button><p><small>输入缩小至128×128，最多64个区域。适合无渐变的平涂图；小于最小面积的区域透明留空。相邻指共享像素边。</small></p></section><section><b>工作文件</b><div class="actions"><button id="duplicate">复制当前项目</button><a class="download" id="export" href="#" download>下载换色包 ZIP</a><a class="download" id="png" href="#" download>下载当前 PNG</a><a class="download" id="swatches" href="#" download>下载色板</a></div><label>恢复换色包内 pattern.json<input type="file" id="import" accept=".json"></label></section></aside><article><section><div class="actions"><select id="mode"><option value="color">当前配色</option><option value="original">原图</option><option value="outline">区域边界</option></select><button id="undo">撤销</button><button id="redo">重做</button><button id="refresh">刷新</button><button id="clear">取消选择</button></div><canvas id="canvas" width="120" height="96"></canvas><p><small>单击区域选择；按住 Shift 可多选。下面区域列表也可多选。</small></p><div id="stats"></div></section><section><b>2 · 手动配色</b><div id="palette"></div><div class="actions"><input type="color" id="color" value="#ef8354"><button id="paint" class="primary">给选中区域换色</button><button id="lock">锁定颜色</button><button id="unlock">解除锁定</button><button id="reset">未锁区域恢复原色</button></div><div class="actions"><input id="regionname" placeholder="区域名称"><button id="rename">给选区命名</button><button id="merge">合并相邻选区</button></div><p><small>锁定区域不会被换色、恢复原色或合并修改。</small></p><div id="regions"></div></section><section><b>3 · 色板与记录</b><label>色板（2–8个十六进制颜色，以逗号分隔）<textarea id="paletteedit" rows="2"></textarea></label><button id="savepalette">保存色板</button><label>配色笔记<textarea id="notes" rows="3"></textarea></label><button id="savenotes">保存笔记</button></section></article></main><script>
let p=null,s=null,selected=new Set();const $=id=>document.getElementById(id);async function api(url,data){const r=await fetch(url,data instanceof FormData?{method:'POST',body:data}:data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}async function run(fn){$('error').textContent='';try{await fn()}catch(e){$('error').textContent=e.message}}async function state(){const d=await api('/colorcart/state');for(const [id,rows]of [['images',d.images],['patterns',d.patterns]]){let old=$(id).value;$(id).replaceChildren(...rows.map(x=>{let o=document.createElement('option');o.value=x.id;o.textContent=x.name;return o}));if(rows.some(x=>x.id===old))$(id).value=old}return d}function adopt(d){p=d.pattern;s=d.summary;selected=new Set([...selected].filter(x=>p.regions[x]));$('paletteedit').value=p.palette.join(', ');$('notes').value=p.notes;draw();state();$('status').textContent=`正在编辑：${p.name} · 修订 ${p.revision} · 已保存`}function need(){if(!p)throw Error('请先建立或打开区域图')}async function change(b){need();adopt(await api(`/colorcart/patterns/${p.id}/edit`,{...b,revision:p.revision}))}function draw(){if(!p)return;for(const [id,suffix]of [['export','.zip'],['png','.png'],['swatches','/palette.png']])$(id).href=`/colorcart/patterns/${p.id}${suffix}`;let c=$('canvas');c.width=s.width;c.height=s.height;let ctx=c.getContext('2d'),im=new Image();im.onload=()=>{ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(im,0,0);ctx.fillStyle='rgba(255,240,80,.45)';p.labels.forEach((row,y)=>row.forEach((v,x)=>{if(selected.has(v))ctx.fillRect(x,y,1,1)}))};im.src=`/colorcart/patterns/${p.id}.png?mode=${$('mode').value}&r=${p.revision}`;$('stats').textContent=`${s.width} × ${s.height} · ${s.region_count} 个区域 · ${s.adjacency.length} 组相邻 · ${s.equal_neighbors.length} 组同色相邻\n已选：${[...selected].join(', ')||'无'}`;$('regions').replaceChildren(...s.regions.map(r=>{let b=document.createElement('button');b.className='region'+(selected.has(r.id)?' selected':'');let sw=document.createElement('span');sw.className='swatch';sw.style.background=r.color;b.append(sw,document.createTextNode(` ${r.id} ${r.name} ${r.locked?'🔒':''} (${r.area})`));b.onclick=()=>{selected.has(r.id)?selected.delete(r.id):selected.add(r.id);draw()};return b}));$('palette').replaceChildren(...p.palette.map(color=>{let b=document.createElement('button');b.style.background=color;b.textContent=' ';b.title=color;b.onclick=()=>$('color').value=color;return b}))}function bind(id,fn){$(id).onclick=()=>run(fn)}bind('demo',async()=>{let d=await api('/colorcart/demo',{});await state();$('images').value=d.image.id;$('status').textContent='合成演示已载入，请建立区域图'});$('upload').onchange=()=>run(async()=>{let f=new FormData();f.append('file',$('upload').files[0]);let d=await api('/colorcart/upload',f);await state();$('images').value=d.image.id});bind('create',async()=>{selected.clear();adopt(await api('/colorcart/patterns',{image_id:$('images').value,name:$('name').value,colors:+$('colors').value,min_area:+$('minarea').value}))});bind('open',async()=>{selected.clear();adopt(await api('/colorcart/patterns/'+$('patterns').value))});$('mode').onchange=draw;$('canvas').onclick=e=>{if(!p)return;let r=e.currentTarget.getBoundingClientRect(),x=Math.min(s.width-1,Math.floor((e.clientX-r.left)*s.width/r.width)),y=Math.min(s.height-1,Math.floor((e.clientY-r.top)*s.height/r.height)),id=p.labels[y][x];if(!e.shiftKey)selected.clear();if(id)selected.has(id)?selected.delete(id):selected.add(id);draw()};bind('clear',()=>{selected.clear();draw()});bind('paint',()=>change({action:'paint',regions:[...selected],color:$('color').value}));for(let [id,locked]of [['lock',true],['unlock',false]])bind(id,()=>change({action:'lock',regions:[...selected],locked}));bind('reset',()=>change({action:'reset'}));bind('rename',()=>change({action:'rename',regions:[...selected],name:$('regionname').value}));bind('merge',()=>change({action:'merge',regions:[...selected]}));bind('savepalette',()=>change({action:'palette',palette:$('paletteedit').value.split(',').map(x=>x.trim())}));bind('savenotes',()=>change({action:'notes',notes:$('notes').value}));for(let id of ['undo','redo'])bind(id,async()=>{need();adopt(await api(`/colorcart/patterns/${p.id}/history`,{revision:p.revision,action:id}))});bind('refresh',async()=>{need();adopt(await api('/colorcart/patterns/'+p.id))});bind('duplicate',async()=>{need();adopt(await api(`/colorcart/patterns/${p.id}/duplicate`,{}))});$('import').onchange=()=>run(async()=>adopt(await api('/colorcart/import',{pattern:JSON.parse(await $('import').files[0].text())})));run(state);
</script></html>
